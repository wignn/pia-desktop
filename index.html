<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCA Alpha</title>
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
  </head>
  <body>
    <div id="root">
      <main class="boot-splash" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-mark" aria-hidden="true">O</div>
        <strong>ORCA ALPHA</strong>
        <span>Preparing your workspace…</span>
        <div class="boot-track" aria-hidden="true"><i></i></div>
      </main>
    </div>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; width: 100%; height: 100%; background: #0b0e14; color: #d8dce6; font: 12px system-ui, sans-serif; }
      .boot-splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0b0e14; }
      .boot-mark { width: 54px; height: 54px; display: grid; place-items: center; border: 1px solid #0052ffa8; border-radius: 50%; color: #38bdf8; font: 700 25px system-ui, sans-serif; box-shadow: 0 0 24px #0052ff30; }
      .boot-splash strong { letter-spacing: .16em; font-size: 11px; }
      .boot-splash span { color: #838896; }
      .boot-track { width: 180px; height: 3px; overflow: hidden; border-radius: 8px; background: #ffffff12; }
      .boot-track i { display: block; width: 42%; height: 100%; border-radius: inherit; background: #0052ff; animation: boot-progress 1.4s ease-in-out infinite; }
      @keyframes boot-progress { from { transform: translateX(-110%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .boot-track i { animation: none; width: 100%; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
