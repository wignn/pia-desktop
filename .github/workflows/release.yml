name: Release ORCA Alpha

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    env:
      PIA_BASE_URL: ${{ secrets.PIA_BASE_URL }}
      PIA_WS_URL: ${{ secrets.PIA_WS_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python runtime builder
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CPU runtime dependencies
        run: python -m pip install -r runtime/requirements.lock.txt

      - name: Verify and bundle CPU runtime
        run: |
          python -m unittest discover -s runtime -p "test_*.py" -v
          python runtime/build.py

      - name: Cache verified model assets
        uses: actions/cache@v4
        with:
          path: .superpowers/kronos-model-cache
          key: kronos-weights-${{ hashFiles('runtime/model-manifest.json') }}

      - name: Verify actual bundled CPU inference and offline cache
        shell: bash
        run: |
          RUNTIME="$PWD/src-tauri/resources/kronos-runtime/kronos-worker"
          if [ "$RUNNER_OS" = "Windows" ]; then RUNTIME="$RUNTIME.exe"; fi
          python runtime/smoke.py --runtime "$RUNTIME" --cache-dir .superpowers/kronos-model-cache
          python runtime/smoke.py --runtime "$RUNTIME" --cache-dir .superpowers/kronos-model-cache --offline
          python runtime/smoke.py --runtime "$RUNTIME" --cache-dir .superpowers/kronos-model-cache --parent-exit

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: |
          bun run typecheck
          bun run test
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Audit frontend dependencies
        run: bun audit --audit-level high

      - name: Build Desktop Application & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ORCA Alpha v__VERSION__'
          releaseBody: 'Automated release for ORCA Alpha v__VERSION__. Includes auto-update manifest and signed installers for Windows, macOS, and Linux.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
